<!DOCTYPE html>

<html class="text-[2vh]">
    <head>
        <title>Blackjack!!</title>
        <link rel="stylesheet" href="styles/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="bg-linear-to-b from-purple-950 to-fuchsia-700">
        <div class="flex w-screen h-screen justify-center items-center">
            <div id="table" class="flex flex-col items-center w-fit h-fit">
                <div id="dealer-hand" class="flex flex-row size-fit">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_clubs.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_diamonds.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_spades.png">
                </div>
                <div id="player-hand" class="flex flex-row size-fit">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_clubs.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_diamonds.png">
                </div>
            </div>
        </div>
    </body>

    <script src="scripts/script.js"></script>
</html>
