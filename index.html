<!DOCTYPE html>

<html class="text-[2vh]">
    <head>
        <title>Blackjack!!</title>
        <link rel="stylesheet" href="styles/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="bg-linear-to-b from-purple-950 to-fuchsia-700">
        <div class="flex flex-row relative w-screen h-screen justify-center items-center">
            <div id="leftovers" class="left-30 w-30 h-fit m-16 opacity-0">
                <img class="w-auto h-auto rounded-lg" src="imgs/back.png">
            </div>
            <div id="table" class="flex flex-col items-center w-fit h-fit">
                <div id="dealer-hand" class="flex flex-row size-fit">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_hearts.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/king_hearts.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/queen_hearts.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/jack_hearts.png">
                </div>
                <div id="player-hand" class="flex flex-row size-fit">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/ace_spades.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/king_spades.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/queen_spades.png">
                    <img class="w-28 h-auto rounded-lg m-2" src="imgs/jack_spades.png">
                </div>
            </div>
            <div id="deck" class="w-30 h-fit m-16">
                <img class="w-auto h-auto rounded-lg" src="imgs/back.png">
            </div>
        </div>
    </body>

    <script src="scripts/script.js"></script>
</html>
