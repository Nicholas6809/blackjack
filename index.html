<!DOCTYPE html>

<html class="text-[2vh]">
    <head>
        <title>Blackjack!!</title>
        <link rel="stylesheet" href="styles/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="bg-linear-to-b from-purple-950 to-fuchsia-700">
        <div class="flex flex-col relative w-screen h-screen justify-center items-center">
            <div class="flex flex-col relative w-50 h-0 justify-center items-center">
                <header id="header" class="text-white text-center text-4xl">BLACKJACK!</header>
            </div>
            <div class="flex flex-row relative p-16 w-full h-fit justify-center items-center">
                <div id="leftovers" class="flex flex-col max-w-1/8 w-fit h-fit items-center-center transition-opacity duration-300 ease-linear opacity-0">
                    <img class="w-30 h-auto rounded-lg" src="imgs/back.png">
                </div>
                <div id="table" class="flex flex-col items-center min-w-6/8 w-fit h-fit">
                    <p id="dealer-label" class="text-white transition-opacity duration-300 ease-linear opacity-0">Dealer's hand</p>
                    <div id="dealer-hand" class="flex flex-row w-fit h-[11.9rem]">
                    </div>
                    <p id="player-label" class="text-white transition-opacity duration-300 ease-linear opacity-0">Your hand</p>
                    <div id="player-hand" class="flex flex-row w-fit h-[11.9rem]">
                    </div>
                </div>
                <div id="deck" class="flex flex-col max-w-1/8 w-fit h-fit items-center">
                    <img class="w-30 h-auto rounded-lg" src="imgs/back.png">
                </div>
            </div>
            <div id="button-area" class="flex flex-row w-fit h-4 justify-center items-center">
                <button onclick="beginHand()" class="pl-2 pr-2 pt-1 pb-1 bg-green-700 border-2 rounded-md border-green-400 text-green-200 active:scale-95">Start!</button>
            </div>
        </div>
    </body>

    <script src="scripts/script.js"></script>
</html>
